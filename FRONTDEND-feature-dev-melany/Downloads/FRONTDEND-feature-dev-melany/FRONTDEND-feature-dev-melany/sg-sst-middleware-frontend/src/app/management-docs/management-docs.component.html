<div class="management-docs-container">
    <div class="search-bar">
      <mat-form-field appearance="outline" class="search-input">
        <mat-label>Buscar documentos...</mat-label>
        <input matInput [(ngModel)]="searchText" (keyup.enter)="onSearch()" placeholder="Ingrese término de búsqueda">
        <button mat-icon-button matSuffix (click)="onSearch()" [disabled]="!searchText">
          <mat-icon>search</mat-icon>
        </button>
        <button *ngIf="searchText" mat-icon-button matPrefix (click)="clearSearch()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
    </div>
  
    <div class="results-info" *ngIf="searchText() && filteredSections().length > 0">
      <mat-chip>{{ filteredSections().length }} categorías encontradas</mat-chip>
      <mat-chip>{{ totalFilteredSubsections() }} documentos encontrados</mat-chip>
    </div>
  
    <mat-accordion multi="false" class="sections-accordion">
      <mat-expansion-panel *ngFor="let section of filteredSections()" (opened)="onPanelOpened(section)">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <mat-icon class="section-icon">folder</mat-icon>
            {{ section.title }}
            <span class="subsection-count">({{ section.subsections.length }})</span>
          </mat-panel-title>
        </mat-expansion-panel-header>
  
        <div class="subsections-container">
          <mat-card 
            *ngFor="let subsection of section.subsections" 
            class="subsection-card" 
            (click)="selectSubsection(subsection)"
            [class.selected]="selectedSubsection() === subsection"
            [attr.aria-current]="selectedSubsection() === subsection ? 'true' : null"
          >
            <mat-icon class="subsection-icon">description</mat-icon>
            <span class="subsection-text">{{ subsection }}</span>
          </mat-card>
  
          <div *ngIf="selectedSubsection()" class="subsection-actions">
            <button mat-raised-button color="primary" (click)="uploadDocument()">
              <mat-icon>upload</mat-icon>
              Subir PDF
            </button>
            <button mat-raised-button color="accent" (click)="downloadDocument()" [disabled]="!hasDocument(selectedSubsection()!)">
              <mat-icon>download</mat-icon>
              Descargar PDF
            </button>
            <button mat-stroked-button color="warn" (click)="clearSelection()">
              <mat-icon>clear</mat-icon>
              Cancelar
            </button>
          </div>
        </div>
      </mat-expansion-panel>
  
      <div class="no-results" *ngIf="searchText() && filteredSections().length === 0">
        <mat-icon class="no-results-icon">search_off</mat-icon>
        <h3>No se encontraron resultados para "{{ searchText() }}"</h3>
        <button mat-button color="primary" (click)="clearSearch()">Limpiar búsqueda</button>
      </div>
    </mat-accordion>
  </div>
