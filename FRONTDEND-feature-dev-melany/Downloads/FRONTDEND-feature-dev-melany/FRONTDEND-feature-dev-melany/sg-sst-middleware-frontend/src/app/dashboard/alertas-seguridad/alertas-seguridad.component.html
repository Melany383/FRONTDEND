<div class="card mb-3">
    <div class="card-header bg-danger text-white">
      <strong>Alertas de Seguridad</strong>
    </div>
    <div class="card-body">
      <ul class="list-group">
        <li *ngFor="let alerta of alertas" class="list-group-item d-flex justify-content-between align-items-start">
          <div class="me-auto">
            <div class="fw-bold">{{ alerta.mensaje }}</div>
            <small class="text-muted">Fecha: {{ alerta.fecha }}</small>
          </div>
          <span class="badge"
                [ngClass]="{
                  'bg-danger': alerta.nivel === 'Crítica',
                  'bg-warning text-dark': alerta.nivel === 'Alta',
                  'bg-info': alerta.nivel === 'Media'
                }">
            {{ alerta.nivel }}
          </span>
        </li>
      </ul>
    </div>
  </div>
