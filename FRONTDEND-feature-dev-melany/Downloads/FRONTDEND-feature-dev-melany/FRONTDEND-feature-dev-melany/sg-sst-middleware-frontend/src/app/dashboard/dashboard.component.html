<div class="app-container" >
  <button class="mobile-toggle" mat-icon-button (click)="toggleSidebar()" *ngIf="isMobile" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>
  
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed" [attr.aria-expanded]="!sidebarCollapsed">
    <div class="sidebar-header">
      <img src="assets/logo.svg" alt="Logo" class="logo" *ngIf="!sidebarCollapsed">
      <button mat-icon-button class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <mat-icon>{{sidebarCollapsed ? 'menu' : 'chevron_left'}}</mat-icon>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <ul>
        <li *ngFor="let item of menuItems" [class.active]="isActive(item.link)">
          <a [routerLink]="item.link" [matTooltip]="item.name" [matTooltipDisabled]="!sidebarCollapsed" [attr.aria-current]="isActive(item.link) ? 'page' : null">
            <mat-icon aria-hidden="true">{{item.icon}}</mat-icon>
            <span>{{item.name}}</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="user-profile" *ngIf="!sidebarCollapsed">
        <img [src]="userProfile.photo || 'assets/default-avatar.png'" alt="User" class="profile-pic">
        <div class="user-info">
          <span class="name">{{userProfile.name}}</span>
          <span class="role">{{userProfile.role}}</span>
          <span class="company-name" *ngIf="userProfile.companyName">{{userProfile.companyName}}</span>
        </div>
      </div>

    </div>
  </aside>

  <main class="main-content">
    <mat-menu #userMenu="matMenu" class="user-menu">
      <div class="user-menu-header">
        <img [src]="userProfile.photo || 'assets/default-avatar.png'" alt="User">
        <div>
          <h3>{{userProfile.name}}</h3>
          <p>{{userProfile.email}}</p>
          <p *ngIf="userProfile.companyName">{{userProfile.companyName}}</p>
        </div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
