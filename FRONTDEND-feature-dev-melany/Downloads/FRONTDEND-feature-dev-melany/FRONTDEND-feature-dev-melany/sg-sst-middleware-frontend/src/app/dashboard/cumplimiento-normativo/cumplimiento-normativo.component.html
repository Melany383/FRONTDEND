<div class="card mb-3">
    <div class="card-header bg-info text-white">
      <strong>Cumplimiento Normativo</strong>
    </div>
    <div class="card-body">
      <div *ngFor="let norma of normativas" class="mb-3">
        <label>{{ norma.nombre }} ({{ norma.cumplimiento }}%)</label>
        <div class="progress">
          <div class="progress-bar bg-success" role="progressbar" [style.width.%]="norma.cumplimiento">
            {{ norma.cumplimiento }}%
          </div>
        </div>
      </div>
    </div>
  </div>
