<!-- Asignación de nuevas tareas (solo si es admin) -->
<div *ngIf="esAdmin" class="card mb-3">
  <div class="card-header bg-info text-white">
    <strong>Asignar nueva tarea</strong>
  </div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-3">
        <input [(ngModel)]="nuevaTarea.titulo" placeholder="Título" class="form-control" />
      </div>
      <div class="col-md-2">
        <input [(ngModel)]="nuevaTarea.fecha" type="date" class="form-control" />
      </div>
      <div class="col-md-2">
        <input [(ngModel)]="nuevaTarea.asignadoA" placeholder="Asignado a" class="form-control" />
      </div>
      <div class="col-md-2">
        <select [(ngModel)]="nuevaTarea.prioridad" class="form-select">
          <option>Alta</option>
          <option>Media</option>
          <option>Baja</option>
        </select>
      </div>
      <div class="col-md-2">
        <button (click)="agregarTarea()" class="btn btn-primary w-100">Agregar</button>
      </div>
    </div>
  </div>
</div>

<!-- Tareas Pendientes -->
<div class="card mb-3">
  <div class="card-header bg-warning text-dark">
    <strong>Tareas Pendientes</strong>
  </div>
  <div class="card-body">
    <ul class="list-group">
      <li *ngFor="let tarea of tareasPendientes()" class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <strong>{{ tarea.titulo }}</strong><br />
          <small>Fecha límite: {{ tarea.fecha }}</small><br />
          <small>Asignado a: {{ tarea.asignadoA }}</small>
        </div>
        <div class="d-flex align-items-center">
          <span class="badge me-2"
                [ngClass]="{
                  'bg-danger': tarea.prioridad === 'Alta',
                  'bg-warning text-dark': tarea.prioridad === 'Media',
                  'bg-secondary': tarea.prioridad === 'Baja'
                }">
            {{ tarea.prioridad }}
          </span>
          <button *ngIf="tarea.asignadoA === usuarioActual && !tarea.completada"
                  (click)="marcarComoCompletada(tarea)"
                  class="btn btn-success btn-sm">
            Completar
          </button>
        </div>
      </li>
    </ul>
  </div>
</div>

<!-- Tareas Completadas -->
<div class="card">
  <div class="card-header bg-success text-white">
    <strong>Tareas Completadas</strong>
  </div>
  <div class="card-body">
    <ul class="list-group">
      <li *ngFor="let tarea of tareasCompletadas()" class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          ✅ <strong>{{ tarea.titulo }}</strong><br />
          <small>Fecha: {{ tarea.fecha }}</small><br />
          <small>Asignado a: {{ tarea.asignadoA }}</small>
        </div>
        <span class="badge"
              [ngClass]="{
                'bg-danger': tarea.prioridad === 'Alta',
                'bg-warning text-dark': tarea.prioridad === 'Media',
                'bg-secondary': tarea.prioridad === 'Baja'
              }">
          {{ tarea.prioridad }}
        </span>
      </li>
    </ul>
  </div>
</div>
