<div class="container-fluid p-0">
  <section class="login-section py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-sm border-0 p-4 login-card">
            <div class="text-center mb-4">
              <h2 class="fw-bold mt-3">Iniciar Sesión</h2>
              <p class="text-muted">Accede a tu cuenta Oppy</p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <mat-form-field appearance="outline" class="w-100 mb-3">
                <mat-label>Correo electrónico</mat-label>
                <input matInput type="email" formControlName="email" aria-label="Correo electrónico">
                <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                  Introduce un correo válido.
                </mat-error>
              </mat-form-field>

              <div class="d-flex justify-content-center">
            <mat-form-field appearance="outline" class="w-100 mb-3">
           <mat-label>Contraseña</mat-label>

           <input matInput
           [type]="hidePassword ? 'password' : 'text'"
           formControlName="password"
           aria-label="Contraseña">

    
            <button mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>

               <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                 La contraseña debe tener al menos 6 caracteres.
              </mat-error>
            </mat-form-field>
        </div>




              <button type="submit" class="btn btn-primary w-100 py-2 mb-3" [disabled]="loginForm.invalid">
                Ingresar
              </button>

              <div class="text-center mt-4">
                <a href="#" class="text-primary">¿Olvidaste tu contraseña?</a>
                <p class="mt-2">
                  ¿No tienes cuenta? 
                  <a (click)="openRegisterForm()" class="fw-bold text-primary">Regístrate</a>
                </p>
              </div>
