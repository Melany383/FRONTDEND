  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">



<!-- footer.component.html -->
<footer class="footer-section py-6">
  <div class="container">
    <div class="row g-5 align-items-start">
      <!-- Logo y descripción -->
      <div class="col-lg-4">
        <h4 class="fw-bold mb-4 text-white">OPPY</h4>
        <p class="text-white-50">
          La plataforma integral para la gestión de Seguridad y Salud en el Trabajo.
        </p>
        <div class="social-icons mt-4">
          <a href="#" class="social-icon"><i class="bi bi-facebook"></i></a>
          <a href="#" class="social-icon"><i class="bi bi-linkedin"></i></a>
          <a href="#" class="social-icon"><i class="bi bi-twitter"></i></a>
          <a href="#" class="social-icon"><i class="bi bi-instagram"></i></a>
        </div>
      </div>

      <!-- Menú del Footer -->
      <div class="col-lg-2 col-md-4" *ngFor="let menu of footerMenus">
        <h5 class="fw-bold mb-4 text-white">{{menu.title}}</h5>
        <ul class="footer-links">
          <li *ngFor="let item of menu.items">
            <a [routerLink]="item.link">{{item.text}}</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Línea divisoria -->
    <hr class="my-5 opacity-50">

    <!-- Derechos reservados -->
    <div class="row text-center text-md-start align-items-center">
      <div class="col-md-6">
        <p class="small mb-0 text-white-50">&copy; {{ currentYear }} Oppy. Todos los derechos reservados.</p>
      </div>
      <div class="col-md-6 text-md-end">
        <p class="small mb-0 text-white-50">
          Desarrollado por OPPTECH
        </p>
      </div>
    </div>
  </div>
</footer>
