<div class="container mt-4">
  <h2>Empleados</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Cargo</th>
        <th>Fecha de ingreso</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let employee of employees">
        <td>{{ employee.name }}</td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.role }}</td>
        <td>{{ employee.position }}</td>
        <td>{{ employee.joinedAt | date: 'shortDate' }}</td>
        <td>
          <button class="btn btn-sm btn-primary me-2" (click)="openEditModal(employee)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="confirmDelete(employee)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal de edición -->
  <div *ngIf="isEditModalOpen" class="modal-backdrop">
    <div class="modal-content">
      <h4>Editar empleado</h4>
      <label>Nombre:</label>
      <input [(ngModel)]="selectedEmployee!.name" class="form-control mb-2">

      <label>Email:</label>
      <input [(ngModel)]="selectedEmployee!.email" class="form-control mb-2">

      <label>Rol:</label>
      <select [(ngModel)]="selectedEmployee!.role" class="form-select mb-2">
        <option value="admin">Admin</option>
        <option value="supervisor">Supervisor</option>
        <option value="employee">Empleado</option>
      </select>

      <label>Cargo:</label>
      <input [(ngModel)]="selectedEmployee!.position" class="form-control mb-2">

      <div class="d-flex justify-content-end">
        <button class="btn btn-secondary me-2" (click)="cancelEdit()">Cancelar</button>
        <button class="btn btn-success" (click)="saveEmployee()">Guardar</button>
      </div>
    </div>
  </div>
</div>
